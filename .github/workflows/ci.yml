name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore wSpot.slnx

    - name: Build Solution
      run: dotnet build wSpot.slnx -c Release --no-restore

    - name: Run Unit Tests
      run: dotnet test wSpot.slnx -c Release --no-build --verbosity normal
